services:
  - type: web
    name: shreesht-portfolio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: 0.0.0.0
