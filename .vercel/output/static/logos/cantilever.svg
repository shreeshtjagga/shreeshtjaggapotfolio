<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Rotated 45 degrees diamond symbol of Cantilever Labs -->
  <g transform="translate(100, 100) rotate(45)">
    <!-- Top arm: blue head -->
    <g transform="translate(0, -50)">
      <path d="M -22 -10 L -22 20 A 10 10 0 0 0 -12 30 L 12 30 A 10 10 0 0 0 22 20 L 22 -10" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="0" cy="5" r="13" fill="#005A9C" />
    </g>

    <!-- Bottom arm: yellow head -->
    <g transform="translate(0, 50) rotate(180)">
      <path d="M -22 -10 L -22 20 A 10 10 0 0 0 -12 30 L 12 30 A 10 10 0 0 0 22 20 L 22 -10" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="0" cy="5" r="13" fill="#F5A623" />
    </g>

    <!-- Right arm: blue head -->
    <g transform="translate(50, 0) rotate(90)">
      <path d="M -22 -10 L -22 20 A 10 10 0 0 0 -12 30 L 12 30 A 10 10 0 0 0 22 20 L 22 -10" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="0" cy="5" r="13" fill="#005A9C" />
    </g>

    <!-- Left arm: yellow head -->
    <g transform="translate(-50, 0) rotate(-90)">
      <path d="M -22 -10 L -22 20 A 10 10 0 0 0 -12 30 L 12 30 A 10 10 0 0 0 22 20 L 22 -10" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="0" cy="5" r="13" fill="#F5A623" />
    </g>
  </g>
</svg>
