<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="500" rx="28" fill="url(#avatarBg)" />
  
  <!-- Cyber Grid / Mesh in Background -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <circle cx="200" cy="190" r="140" fill="url(#halo)" />

  <!-- Stylized Geometric Avatar Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 90 460 C 90 350 140 330 200 330 C 260 330 310 350 310 460 Z" fill="#1e293b" stroke="url(#neonGlow)" stroke-width="2" />
  <path d="M 140 460 L 200 360 L 260 460" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  
  <!-- Neck -->
  <rect x="180" y="270" width="40" height="70" rx="6" fill="#334155" />

  <!-- Head / Face Polygon -->
  <path d="M 130 180 L 150 110 L 200 85 L 250 110 L 270 180 L 250 260 L 200 290 L 150 260 Z" fill="#1e293b" stroke="url(#neonGlow)" stroke-width="3" />
  
  <!-- Sleek Cyber Visor / Focus Line -->
  <path d="M 145 170 L 255 170" stroke="url(#neonGlow)" stroke-width="6" stroke-linecap="round" />
  <circle cx="200" cy="170" r="4" fill="#FFFFFF" />

  <!-- Nodes / Circuit Lines -->
  <circle cx="150" cy="110" r="4" fill="#38bdf8" />
  <circle cx="250" cy="110" r="4" fill="#c084fc" />
  <circle cx="200" cy="85" r="4" fill="#818cf8" />
  <circle cx="200" cy="290" r="4" fill="#38bdf8" />

  <!-- Text Overlay at bottom -->
  <rect x="50" y="420" width="300" height="46" rx="23" fill="#0b0f19" stroke="#38bdf8" stroke-opacity="0.3" />
  <text x="200" y="448" font-family="'Sora', sans-serif" font-weight="600" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SHREESHT JAGGA</text>
</svg>
